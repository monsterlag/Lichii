name: Build 88 Windows MinGW PGO AV1 package

on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

jobs:
  windows-mingw-pgo:
    name: Build and package the Windows MinGW PGO GUI and CLI
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p ffmpeg:p

      - name: Check PGO profile
        shell: msys2 {0}
        run: test -s eglantine.profdata

      - name: Restore CPM downloads
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-windows-x86_64-pgo-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-windows-x86_64-pgo-v2-
            cpm-windows-x86_64-v2-
            cpm-Windows-

      - name: Configure MinGW PGO GUI, CLI and AV1 probe
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DLICHII_AV1_SMOKE_TEST=ON \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=OFF \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=manual-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=windows-x86_64-pgo \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      # Match release-binaries.yml production parallelism; build 88 passed with this setting on windows-2022.
      - name: Build GUI, CLI and AV1 probe
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          cmake --build build/release --target av1_decode_smoke --parallel 2
          ccache --show-stats

      - name: Package GUI, CLI, Qt plugins and recursive DLL closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          test -f eden-cli.exe
          test -f av1_decode_smoke.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in lichii.exe eden-cli.exe av1_decode_smoke.exe; do
            deps "$exe"
          done
          find . -name '*.dll' -print0 | while IFS= read -r -d '' dll; do
            deps "$dll"
          done

      # CLI --help exits before System::Initialize. GUI --help is unsuitable: main() runs
      # StartupChecks (including the Vulkan check) before MainWindow parses arguments, so it
      # would start GUI/Vulkan work instead of exiting as a loader-only check.
      - name: Run packaged CLI and AV1 checks with system-only PATH
        timeout-minutes: 2
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'build/release/bin'
          $report = Join-Path $packageDir 'AV1-DECODE-SMOKE.txt'
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Push-Location $packageDir
            try {
              'GUI loader check omitted: --help reaches StartupChecks and may run Vulkan/UI startup.' | Out-File -FilePath $report -Encoding utf8
              $cliOutput = & ./eden-cli.exe --help 2>&1
              $cliExitCode = $LASTEXITCODE
              $cliOutput | Add-Content -Path $report
              "CLI --help exit code: $cliExitCode" | Add-Content -Path $report
              if ($cliExitCode -ne 0) {
                throw "Packaged CLI --help failed: $cliExitCode"
              }
              $av1Output = & ./av1_decode_smoke.exe 2>&1
              $av1ExitCode = $LASTEXITCODE
              $av1Output | Add-Content -Path $report
              "AV1 probe exit code: $av1ExitCode" | Add-Content -Path $report
              if ($av1ExitCode -ne 0) {
                throw "Packaged AV1 probe failed: $av1ExitCode"
              }
              Get-Content -LiteralPath $report
              Remove-Item -LiteralPath ./av1_decode_smoke.exe
              if (Test-Path -LiteralPath ./av1_decode_smoke.pdb) {
                Remove-Item -LiteralPath ./av1_decode_smoke.pdb
              }
            } finally {
              Pop-Location
            }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Upload complete Windows MinGW PGO package and AV1 evidence
        uses: actions/upload-artifact@v7
        with:
          name: lichii-build88-windows-x86_64-pgo-mingw-av1-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
