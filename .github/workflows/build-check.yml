name: build-check

on:
  pull_request:
    branches: [nx2]
  push:
    branches: [nx2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    name: Linux GCC 13 production build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf gcc-13 g++-13 git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache pipx \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Cache dependencies and compiler objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-qt683-${{ runner.os }}-${{ hashFiles('cpmfile.json') }}-${{ github.sha }}
          restore-keys: |
            gcc13-qt683-${{ runner.os }}-${{ hashFiles('cpmfile.json') }}-

      - name: Configure production and tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_WERROR=ON \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DENABLE_QT=ON \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Build production and tests
        run: cmake --build build --parallel 4

      - name: Test split front restart
        timeout-minutes: 5
        run: |
          EDEN_NX2_SPLIT=2 \
          EDEN_NX2_MME_JIT=1 \
          EDEN_NX2_SPLIT_SKIP=1 \
          EDEN_NX2_SKIP_SAME=1 \
            build/bin/tests --reporter compact "[video_core][split_front_restart]"

      - name: Prove split front restart fails without the engine fix
        timeout-minutes: 20
        run: |
          set -euo pipefail
          baseline=09b78bd2dfdd279cc81caed2a794ed85062725c9
          git fetch --no-tags --depth=1 origin "$baseline"
          engine_files=(
            src/video_core/engines/maxwell_3d.cpp
            src/video_core/engines/maxwell_3d.h
            src/video_core/engines/kepler_compute.cpp
            src/video_core/engines/kepler_compute.h
          )
          restore_fixed_and_verify() {
            local original_status=$?
            trap - EXIT
            git restore --worktree -- "${engine_files[@]}"
            cmake --build build --target tests --parallel 4
            EDEN_NX2_SPLIT=2 \
            EDEN_NX2_MME_JIT=1 \
            EDEN_NX2_SPLIT_SKIP=1 \
            EDEN_NX2_SKIP_SAME=1 \
              build/bin/tests --reporter compact "[video_core][split_front_restart]"
            exit "$original_status"
          }
          trap restore_fixed_and_verify EXIT

          git restore --source="$baseline" --worktree -- "${engine_files[@]}"
          cmake --build build --target tests --parallel 4
          set +e
          timeout 120s env \
            EDEN_NX2_SPLIT=2 \
            EDEN_NX2_MME_JIT=1 \
            EDEN_NX2_SPLIT_SKIP=1 \
            EDEN_NX2_SKIP_SAME=1 \
            build/bin/tests --reporter compact "[video_core][split_front_restart]" \
            > build/split-front-negative.log 2>&1
          test_status=$?
          set -e
          cat build/split-front-negative.log
          if [[ "$test_status" -ne 1 ]] || \
             ! grep -Eq 'assertions:.*[1-9][0-9]* failed' build/split-front-negative.log || \
             ! grep -Eq 'failed:.*engine\.GetNativeMacroEngine\(\)\.native_code\[13\]' build/split-front-negative.log || \
             ! grep -Eq 'failed:.*positions\[3\]' build/split-front-negative.log; then
            echo "Expected semantic assertion failures with exit 1; got $test_status."
            exit 1
          fi

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Test debug adapter
        run: python3 tools/nx2/test_debug_mcp.py

      - name: Test ThreadWorker wake-ups
        run: |
          python3 tools/nx2/test_thread_worker_wake.py
          python3 -I tools/nx2/thread_worker_wake.py --cxx g++-13

      - name: Test Linux switch discovery
        run: CXX=g++-13 python3 tools/nx2/test_switches.py
